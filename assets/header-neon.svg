<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="920" height="150">
  <!-- BuzumAIcenter synthwave palette (api/chat.html) -->
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="50%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120033"/>
      <stop offset="55%" stop-color="#1a0040"/>
      <stop offset="100%" stop-color="#0d0021"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="150" rx="16" fill="url(#bg)" stroke="#3d0080" stroke-width="2"/>
  <text x="460" y="58" text-anchor="middle" fill="url(#neon)" font-family="Segoe UI,system-ui,sans-serif" font-size="40" font-weight="800" filter="url(#glow)">Hola  Soy Jota</text>
  <text x="460" y="92" text-anchor="middle" fill="#e0d7ff" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="600">AI personal · mercados · infra · Raspberry gateway</text>
  <text x="460" y="118" text-anchor="middle" fill="#9b87c4" font-size="13">Paleta synthwave BuzumAIcenter · Buenos Aires, Argentina</text>
  <rect x="280" y="132" width="360" height="3" rx="1.5" fill="url(#neon)" opacity="0.85"/>
</svg>
