<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="paleta chameleon">
  <defs>
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#F2EEFF" fill-opacity="0.10"/>
    </pattern>
    <filter id="glowSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="#070318"/>

  <!-- 6 color blocks -->
  <g font-family="Menlo, Consolas, ui-monospace, monospace" font-weight="600">
    <!-- hardware -->
    <g transform="translate(40,40)">
      <rect width="170" height="140" fill="#3DEFE0" filter="url(#glowSoft)"/>
      <rect width="170" height="140" fill="url(#scan)"/>
      <text x="14" y="118" font-size="13" fill="#070318" letter-spacing="1">hardware</text>
      <text x="14" y="135" font-size="10" fill="#070318" fill-opacity="0.65" letter-spacing="1">#3DEFE0</text>
    </g>
    <!-- finance -->
    <g transform="translate(230,40)">
      <rect width="170" height="140" fill="#FFC23D" filter="url(#glowSoft)"/>
      <rect width="170" height="140" fill="url(#scan)"/>
      <text x="14" y="118" font-size="13" fill="#070318" letter-spacing="1">finance</text>
      <text x="14" y="135" font-size="10" fill="#070318" fill-opacity="0.65" letter-spacing="1">#FFC23D</text>
    </g>
    <!-- health -->
    <g transform="translate(420,40)">
      <rect width="170" height="140" fill="#5DFFAE" filter="url(#glowSoft)"/>
      <rect width="170" height="140" fill="url(#scan)"/>
      <text x="14" y="118" font-size="13" fill="#070318" letter-spacing="1">health</text>
      <text x="14" y="135" font-size="10" fill="#070318" fill-opacity="0.65" letter-spacing="1">#5DFFAE</text>
    </g>
    <!-- ops -->
    <g transform="translate(610,40)">
      <rect width="170" height="140" fill="#C03DFF" filter="url(#glowSoft)"/>
      <rect width="170" height="140" fill="url(#scan)"/>
      <text x="14" y="118" font-size="13" fill="#F2EEFF" letter-spacing="1">ops</text>
      <text x="14" y="135" font-size="10" fill="#F2EEFF" fill-opacity="0.7" letter-spacing="1">#C03DFF</text>
    </g>
    <!-- growth -->
    <g transform="translate(800,40)">
      <rect width="170" height="140" fill="#FF6BC5" filter="url(#glowSoft)"/>
      <rect width="170" height="140" fill="url(#scan)"/>
      <text x="14" y="118" font-size="13" fill="#070318" letter-spacing="1">growth</text>
      <text x="14" y="135" font-size="10" fill="#070318" fill-opacity="0.65" letter-spacing="1">#FF6BC5</text>
    </g>
    <!-- research ★ -->
    <g transform="translate(990,40)">
      <rect width="170" height="140" fill="#7B6CFF" filter="url(#glowSoft)"/>
      <rect width="170" height="140" fill="url(#scan)"/>
      <text x="14" y="32" font-size="13" fill="#F2EEFF" letter-spacing="1">★</text>
      <text x="14" y="118" font-size="13" fill="#F2EEFF" letter-spacing="1">research</text>
      <text x="14" y="135" font-size="10" fill="#F2EEFF" fill-opacity="0.7" letter-spacing="1">#7B6CFF</text>
    </g>
  </g>

  <!-- top label -->
  <text x="40" y="24" font-family="Menlo, Consolas, ui-monospace, monospace" font-size="11" fill="#F2EEFF" fill-opacity="0.4" letter-spacing="3">· chameleon system · 1 color per playbook</text>
  <text x="1160" y="24" text-anchor="end" font-family="Menlo, Consolas, ui-monospace, monospace" font-size="11" fill="#F2EEFF" fill-opacity="0.4" letter-spacing="3">v0.2</text>

  <!-- bottom strip -->
  <rect x="0" y="200" width="200" height="2" fill="#3DEFE0"/>
  <rect x="200" y="200" width="200" height="2" fill="#FFC23D"/>
  <rect x="400" y="200" width="200" height="2" fill="#5DFFAE"/>
  <rect x="600" y="200" width="200" height="2" fill="#C03DFF"/>
  <rect x="800" y="200" width="200" height="2" fill="#FF6BC5"/>
  <rect x="1000" y="200" width="200" height="2" fill="#7B6CFF"/>
</svg>
